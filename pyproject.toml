[project]
name = "mibici-proyecto"
version = "0.1.0"
description = "Pipeline reproducible para el proyecto integrador de MiBici"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "mlflow>=2.10",
]

[project.scripts]
mibici-ingest = "mibici.ingestion:main"
mibici-train = "mibici.training:main"

[tool.ruff]
line-length = 100

